# AgenticNav Specification Ledger
# Ground Truth Parameter Ledger for Local & Cluster Replication
# Every constant and config value in code must map to an entry in this ledger with exact matching values.
#
# Permitted tags:
#   - paper_text: Explicitly stated in the paper text / tables
#   - paper_appendix: Explicitly stated in the paper appendix
#   - paper-unspecified: Described in paper without numeric values specified (free parameter)
#   - calibrated_engineering_choice: Hand-calibrated parameter backed by empirical data
#   - deviation: Deliberate departure from paper formulation
#   - local-aid: Prompt or algorithmic scaffolding added for stability/evaluation
#   - habitat_standard: Standard Matterport3D / Habitat-Sim / VLN-CE convention
#   - assumption: Implementation assumption pending ablation

version: "2.0.0"
updated_at: "2026-11-07"
owner: "Antigravity Engineering"

parameters:
  # --- SENSORS & OPTICS ---
  image_width:
    value: 640
    tag: "paper_text"
    source: "paper_text (Sec 3)"
    status: "verified"
    owner: "Perception"
    description: "Panoramic camera image width in pixels"

  image_height:
    value: 480
    tag: "paper_text"
    source: "paper_text (Sec 3)"
    status: "verified"
    owner: "Perception"
    description: "Panoramic camera image height in pixels"

  hfov_deg:
    value: 90.0
    tag: "paper_text"
    source: "paper_text (Sec 3)"
    status: "verified"
    owner: "Perception"
    description: "Horizontal field of view per camera in degrees"

  camera_height:
    value: 1.25
    tag: "paper_text"
    source: "paper_text (Sec 3)"
    status: "verified"
    owner: "Perception"
    description: "Camera mount height above floor datum in meters"

  num_panoramic_views:
    value: 4
    tag: "paper_text"
    source: "paper_text (Sec 1, Sec 3)"
    status: "verified"
    owner: "Perception"
    description: "Number of heading-indexed panoramic cameras (Front, Right, Back, Left)"

  view_azimuths_deg:
    value: [0.0, -90.0, 180.0, 90.0]
    tag: "paper_text"
    source: "paper_text (Sec 3)"
    status: "verified"
    owner: "Perception"
    description: "Camera yaw azimuth offsets in degrees [Front, Right, Back, Left]"

  d_min:
    value: 0.5
    tag: "habitat_standard"
    source: "vln_ce_standard / paper_text (Sec 3)"
    status: "verified"
    owner: "Perception"
    description: "Minimum valid depth sensor reading in meters"

  d_max:
    value: 5.0
    tag: "habitat_standard"
    source: "vln_ce_standard / paper_text (Sec 3)"
    status: "verified"
    owner: "Perception"
    description: "Maximum valid depth sensor reading in meters"

  min_obstacle_depth:
    value: 0.05
    tag: "deviation"
    source: "local_safety_engineering"
    status: "verified"
    owner: "Perception"
    description: "Near-obstacle detection threshold in meters (deviation from 0.5m sensor floor to detect physical obstacles within 0.05m-0.50m; applies to both Arm L and Arm P)"

  blocked_view_zero_depth_threshold:
    value: 0.35
    tag: "calibrated_engineering_choice"
    source: "local_safety_engineering"
    status: "verified"
    owner: "Perception"
    description: "Fraction of zero-depth (unrendered / near-plane clipped) pixels above which a view is marked blocked"

  # --- ACTUATION & KINEMATICS ---
  turn_step_deg:
    value: 15.0
    tag: "habitat_standard"
    source: "vln_ce_standard / paper_text (Sec 1)"
    status: "verified"
    owner: "Kinematics"
    description: "Discrete primitive turn step in degrees (turn_left / turn_right)"

  forward_step_m:
    value: 0.25
    tag: "habitat_standard"
    source: "vln_ce_standard / paper_text (Sec 1)"
    status: "verified"
    owner: "Kinematics"
    description: "Discrete primitive forward step in meters (move_forward)"

  base_margin:
    value: 0.30
    tag: "paper-unspecified"
    source: "paper_text (Sec 4.4 mentions standoff margin m without numerical value)"
    status: "verified"
    owner: "Kinematics"
    description: "Standoff distance subtracted from target distance before move"

  rho_max:
    value: 2.5
    tag: "paper-unspecified"
    source: "paper_text (Sec 4.4 mentions max step length without numerical value)"
    status: "verified"
    owner: "Kinematics"
    description: "Maximum single-step forward motion clamp in meters"

  robot_radius:
    value: 0.10
    tag: "calibrated_engineering_choice"
    source: "calibrated_engineering_choice (matches Habitat-Sim physical agent radius 0.10m; cuts false block rate from 25.4% to 12.3%)"
    status: "verified"
    owner: "Safety"
    description: "Corridor half-width r_a in meters. Calibrated via non-test sweep across 1,980 actions."

  corridor_half_width_m:
    value: 0.10
    tag: "calibrated_engineering_choice"
    source: "paper_text (Sec 4.4: half-width is r_a) / calibrated_engineering_choice"
    status: "verified"
    owner: "Safety"
    description: "Half-width of swept rectangular corridor checker (total width = 0.20m). Matches physical agent radius."

  chassis_y_min:
    value: 0.15
    tag: "calibrated_engineering_choice"
    source: "calibrated_engineering_choice (empirical floor noise datum)"
    status: "verified"
    owner: "Safety"
    description: "Minimum height above floor datum in meters. 0.15m eliminates floor grazing noise (mean 0.013m, sigma 0.071m)."

  chassis_y_max:
    value: 1.25
    tag: "paper-unspecified"
    source: "paper_text (Sec 4.5: agent height band up to camera mount height 1.25m)"
    status: "verified"
    owner: "Safety"
    description: "Maximum height above floor datum for obstacle pointcloud slice in meters"

  zero_rho_policy:
    value: "rotate"
    tag: "assumption"
    source: "assumption"
    status: "assumed"
    owner: "Kinematics"
    description: "Policy when commanded rho rounds to 0: 'rotate' executes pure turn; 'reject' returns no_motion"
    ablation_plan: "Compare rotate vs reject on 20 dev episodes"

  standoff_mode:
    value: "fixed"
    tag: "paper-unspecified"
    source: "paper_text (Sec 4.4)"
    status: "verified"
    owner: "Kinematics"
    description: "Fixed standoff subtraction (0.30m) vs slope ablation"

  adjacent_bin_snap:
    value: false
    tag: "deviation"
    source: "paper_text (default un-snapped)"
    status: "verified"
    owner: "Kinematics"
    description: "Adjacent bin snap switch (false by default)"

  max_snap_deg:
    value: 9.0
    tag: "assumption"
    source: "assumption"
    status: "assumed"
    owner: "Kinematics"
    description: "Max snap angular threshold in degrees"
    ablation_plan: "Ablation only when adjacent_bin_snap is True"

  max_snap_drift_m:
    value: 0.35
    tag: "assumption"
    source: "assumption"
    status: "assumed"
    owner: "Kinematics"
    description: "Max snap drift in meters"
    ablation_plan: "Ablation only when adjacent_bin_snap is True"

  obstacle_source:
    value: "current_frame"
    tag: "paper_text"
    source: "paper_text (Sec 4.5)"
    status: "verified"
    owner: "Safety"
    description: "Source for corridor checking: current_frame pointcloud"

  # --- SPATIAL MEMORY & BEV MAPPING ---
  bev_grid_size:
    value: 256
    tag: "paper_text"
    source: "paper_text (Sec 5.1)"
    status: "verified"
    owner: "Memory"
    description: "Allocentric occupancy grid resolution (256x256 pixels)"

  bev_resolution_m:
    value: 0.15
    tag: "paper_text"
    source: "paper_text (Sec 5.1)"
    status: "verified"
    owner: "Memory"
    description: "Meters per pixel in BEV occupancy grid (256 * 0.15 = 38.4m span)"

  bev_recenter_margin_px:
    value: 32
    tag: "assumption"
    source: "assumption"
    status: "assumed"
    owner: "Memory"
    description: "Padding threshold in pixels before dynamic grid recentering rolls buffer"
    ablation_plan: "Verify zero landmark drift during canvas roll in G5.4"

  bev_log_odds_free:
    value: -0.405
    tag: "paper_text"
    source: "paper_text (Sec 5.2, miss prob 0.4)"
    status: "verified"
    owner: "Memory"
    description: "Log-odds update decrement for free space ray points"

  bev_log_odds_occ:
    value: 0.847
    tag: "paper_text"
    source: "paper_text (Sec 5.2, hit prob 0.7)"
    status: "verified"
    owner: "Memory"
    description: "Log-odds update increment for confirmed obstacle points"

  max_history_steps:
    value: 6
    tag: "paper_text"
    source: "paper_text (Sec 1, Sec 2.2 Table 2)"
    status: "verified"
    owner: "Memory"
    description: "Sliding-window size for action history and rationales (K=6)"

  # --- MULTI-TURN DECISION HARNESS & BUDGETS ---
  max_evidence_queries_per_step:
    value: 4
    tag: "paper_text"
    source: "paper_text (Sec 1, E_max = 4)"
    status: "verified"
    owner: "Harness"
    description: "Maximum query_depth and recall calls permitted before forced motion commit"

  max_consecutive_reselects:
    value: 5
    tag: "paper_text"
    source: "paper_text (Sec 1, R_max = 5)"
    status: "verified"
    owner: "Harness"
    description: "Maximum consecutive reselect iterations for blocked corridor targets"

  max_malformed_calls_per_step:
    value: 3
    tag: "assumption"
    source: "assumption"
    status: "assumed"
    owner: "Harness"
    description: "Maximum retries on syntax/JSON errors before fallback"
    ablation_plan: "Test 1 vs 3 vs 5 retries on dev split"

  max_simulator_actions:
    value: 500
    tag: "habitat_standard"
    source: "vln_ce_standard / paper_text (Sec 3)"
    status: "verified"
    owner: "Harness"
    description: "Total primitive simulator discrete actions allowed before episode budget timeout"

  # --- EVALUATION & GROUND TRUTH ---
  success_distance_m:
    value: 3.0
    tag: "habitat_standard"
    source: "vln_ce_standard / paper_text (Sec 3)"
    status: "verified"
    owner: "Evaluation"
    description: "Distance threshold in meters to goal for success (R2R-CE standard: 3.0m)"

  require_stop_for_success:
    value: true
    tag: "habitat_standard"
    source: "paper_text (Sec 3) / vln_ce_standard"
    status: "verified"
    owner: "Evaluation"
    description: "Episode requires explicit stop() call within success threshold"

  num_test_episodes:
    value: 100
    tag: "paper_text"
    source: "paper_text (Sec 2.1, standard R2R-CE val_unseen subset)"
    status: "verified"
    owner: "Evaluation"
    description: "Locked test episode count"

  test_episodes_file:
    value: "agenticnav_paper_replica/data/opennav_r2rce_100.json"
    tag: "paper_text"
    source: "OpenNav official 100-episode R2R-CE split"
    status: "verified"
    owner: "Evaluation"
    description: "Locked 100-episode JSON file path"

  # --- VLM INFERENCE & CAPABILITIES ---
  vlm_model:
    value: "qwen3.5:4b"
    tag: "deviation"
    source: "engineering_choice (Fits 6GB VRAM on RTX 4050 vs paper Qwen2-VL-7B)"
    status: "verified"
    owner: "VLM"
    description: "Primary development model tag in official Ollama library"

  vlm_thinking:
    value: false
    tag: "calibrated_engineering_choice"
    source: "calibrated (G2.7 audit: 25x speedup, 98% token reduction, zero truncation timeout)"
    status: "verified"
    owner: "VLM"
    description: "Disable thinking tokens via top-level think: false in Ollama payload"

  coordinate_convention:
    value: "normalized_0_to_1"
    tag: "calibrated_engineering_choice"
    source: "calibrated (G2.6 audit: 50 points median error 4.66%)"
    status: "verified"
    owner: "VLM"
    description: "Pixel-grounding coordinate format [0.0, 1.0] with (0,0) top-left"

  tool_calling_protocol:
    value: "formatted_json_code_block"
    tag: "paper_text"
    source: "paper_text (Sec 2.2 / G2.10 protocol decision)"
    status: "verified"
    owner: "VLM"
    description: "Tool calling schema via prompt-level JSON code block"

  fallback_model:
    value: "qwen3-vl:8b"
    tag: "assumption"
    source: "engineering_choice (Cluster match, partial offload)"
    status: "verified"
    owner: "VLM"
    description: "Cluster parity model tag in official Ollama library"

  temperature:
    value: 0.0
    tag: "paper_text"
    source: "paper_text (Sec 2.3, deterministic evaluation)"
    status: "verified"
    owner: "VLM"
    description: "Sampling temperature for VLM generation"

  inference_seed:
    value: 42
    tag: "assumption"
    source: "engineering_choice"
    status: "assumed"
    owner: "VLM"
    description: "RNG seed for reproducibility"
    ablation_plan: "Test seed sensitivity across 3 seeds in Phase 9"

  # --- ABLATION TOGGLES ---
  depth_tool:
    value: "on"
    tag: "paper_text"
    source: "paper_text (Sec 2.2 Table 2)"
    status: "verified"
    owner: "Ablation"
    description: "Depth tool active state: 'on', 'off', 'depth_image'"

  recall_tool:
    value: true
    tag: "paper_text"
    source: "paper_text (Sec 2.2 Table 2)"
    status: "verified"
    owner: "Ablation"
    description: "Recall tool active state (boolean)"

  history_mode:
    value: "reasoning"
    tag: "paper_text"
    source: "paper_text (Sec 2.2 Table 2)"
    status: "verified"
    owner: "Ablation"
    description: "History mode: 'reasoning', 'task_progress', 'none'"

  bev_image:
    value: true
    tag: "paper_text"
    source: "paper_text (Sec 2.2 Table 2)"
    status: "verified"
    owner: "Ablation"
    description: "BEV map image generation active (boolean)"

  image_history:
    value: "on_demand"
    tag: "paper_text"
    source: "paper_text (Sec 2.2 Table 2)"
    status: "verified"
    owner: "Ablation"
    description: "Image history mode: 'on_demand' (recall tool) vs 'accumulate_all'"

  action_mode:
    value: "pixel"
    tag: "paper_text"
    source: "paper_text (Sec 2.2 Table 2)"
    status: "verified"
    owner: "Ablation"
    description: "Action selection mode: 'pixel' (click) vs 'waypoint_predictor'"

  # --- LOCAL AIDS & PROMPT / ALGORITHMIC EXTENSIONS ---
  obstacle_point_threshold:
    value: 5
    tag: "local-aid"
    source: "local-aid (rejects on >=5 points to eliminate single-pixel depth sensor outlier rejections; paper specifies any point >= 1)"
    status: "verified"
    owner: "Safety"
    description: "Obstacle points required inside corridor before move_to is rejected. Arm P uses 1; Arm L uses 5."

  floor_grounding_prompt:
    value: true
    tag: "local-aid"
    source: "local-aid (explicit prompt hint to click floor pixels rather than horizon/walls)"
    status: "verified"
    owner: "Prompt"
    description: "Floor grounding prompt instruction in system prompt. Arm P omits; Arm L includes."

  arrival_verification:
    value: true
    tag: "local-aid"
    source: "local-aid (forces model to verify visual landmarks before issuing final stop)"
    status: "verified"
    owner: "Harness"
    description: "Two-stage arrival verification protocol before stop() is accepted. Arm P omits; Arm L includes."

  reselect_cap:
    value: 5
    tag: "local-aid"
    source: "paper-unspecified / local-aid (R_max = 5 consecutive reselects allowed before deadlock declared)"
    status: "verified"
    owner: "Harness"
    description: "Maximum consecutive reselect iterations before declaring deadlock."

  termination_rule:
    value: "explicit_stop_or_deadlock"
    tag: "local-aid"
    source: "local-aid (terminates on explicit stop(), deadlock, or max simulator actions)"
    status: "verified"
    owner: "Harness"
    description: "Defines episode termination triggers and timeout behavior."
