[project]
name = "agentic-uav"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10.9",
    "solara>=1.57.3",
    "starlette<1.0",
]

[project.optional-dependencies]
# Real LLM backends for the `agentic` method (opt-in; base install stays
# offline). QGenie uses the stdlib urllib, so only boto3 is needed here.
# Install with: uv sync --extra llm
llm = [
    "boto3>=1.35",
]
